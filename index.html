<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML & Web Design Exam Quiz (100 Questions)</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #007bff;
      --correct-color: #28a745;
      --wrong-color: #dc3545;
      --border-color: #dddddd;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
    }

    .quiz-container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .quiz-stats {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .question-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      background-color: #fafafa;
    }

    .question-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .options-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .option-item {
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .option-item:hover {
      background-color: #f0f0f0;
    }

    .option-item.correct {
      background-color: var(--correct-color) !important;
      color: #ffffff !important;
      border-color: var(--correct-color) !important;
    }

    .option-item.wrong {
      background-color: var(--wrong-color) !important;
      color: #ffffff !important;
      border-color: var(--wrong-color) !important;
    }

    .option-item.disabled {
      pointer-events: none;
    }

    .feedback-msg {
      margin-top: 10px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .feedback-msg.correct-text {
      color: var(--correct-color);
    }

    .feedback-msg.wrong-text {
      color: var(--wrong-color);
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background-color: var(--primary-color);
      color: white;
      cursor: pointer;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      body {
        padding: 5px;
      }
      .quiz-container {
        padding: 12px;
      }
      .question-title {
        font-size: 1rem;
      }
      .option-item {
        padding: 10px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

<div class="quiz-container">
  <h1>HTML & Web Design Exam</h1>
  <div class="quiz-stats">
    <span id="progress-text">Question 1 of 100</span>
    <span id="score-text">Score: 0 / 100</span>
  </div>

  <div id="quiz-body">
    <!-- Questions dynamically loaded -->
  </div>

  <div class="nav-buttons">
    <button id="prev-btn" onclick="changeQuestion(-1)" disabled>Previous</button>
    <button id="next-btn" onclick="changeQuestion(1)">Next</button>
  </div>
</div>

<script>
  // 100 Questions covering HTML, Web Design, Internet, E-Commerce, Security
  // Note: For every question, answerAtIndex 0 is NEVER the correct answer (correct index is 1, 2, or 3).
  const questions = [
    {
      q: "What does HTML stand for?",
      options: ["Hyper Transfer Markup Language", "Hyper Text Markup Language", "High Text Machine Language", "Hyperlink Text Management Language"],
      answer: 1
    },
    {
      q: "Which tag is used to create a line break in HTML?",
      options: ["<lb>", "<br>", "<break>", "<newline>"],
      answer: 1
    },
    {
      q: "What type of language is HTML?",
      options: ["Programming Language", "Markup Language", "Database Language", "Scripting Language"],
      answer: 1
    },
    {
      q: "Who invented the World Wide Web (WWW)?",
      options: ["Vint Cerf", "Tim Berners-Lee", "Bob Kahn", "Lawrence Roberts"],
      answer: 1
    },
    {
      q: "Which element is an empty tag in HTML?",
      options: ["<p>", "<hr>", "<div>", "<span>"],
      answer: 1
    },
    {
      q: "What is the correct file extension for saving HTML files?",
      options: [".txt", ".html", ".doc", ".site"],
      answer: 1
    },
    {
      q: "Which heading tag represents the largest heading?",
      options: ["<h6>", "<h1>", "<head>", "<header>"],
      answer: 1
    },
    {
      q: "Which tag is used to display italic text?",
      options: ["<italic>", "<i>", "<emtag>", "<style>"],
      answer: 1
    },
    {
      q: "What is the default alignment for paragraph text in HTML?",
      options: ["Center", "Left", "Right", "Justify"],
      answer: 1
    },
    {
      q: "Which attribute is used to specify the background color of a page in classic HTML?",
      options: ["background", "bgcolor", "color", "style-color"],
      answer: 1
    },
    {
      q: "Which HTML tag is used to define an ordered list?",
      options: ["<ul>", "<ol>", "<li>", "<dl>"],
      answer: 1
    },
    {
      q: "Which tag defines an item inside a list?",
      options: ["<item>", "<li>", "<list>", "<ol-item>"],
      answer: 1
    },
    {
      q: "What is the purpose of the <marquee> tag?",
      options: ["To play audio", "To create scrolling text", "To draw a border", "To highlight text"],
      answer: 1
    },
    {
      q: "Which attribute specifies the image source path in an <img> tag?",
      options: ["link", "src", "href", "file"],
      answer: 1
    },
    {
      q: "What tag is used to create a hyperlink?",
      options: ["<link>", "<a>", "<url>", "<hyper>"],
      answer: 1
    },
    {
      q: "What does 'href' stand for in an anchor tag?",
      options: ["Hyperlink File", "Hypertext Reference", "Header Reference", "HTML Reference"],
      answer: 1
    },
    {
      q: "Which HTML tag is used to render superscript text (e.g., 1st)?",
      options: ["<sub>", "<sup>", "<super>", "<up>"],
      answer: 1
    },
    {
      q: "Which HTML tag is used to render subscript text (e.g., H2O)?",
      options: ["<sup>", "<sub>", "<down>", "<base>"],
      answer: 1
    },
    {
      q: "Which tag is used to embed video files in HTML5?",
      options: ["<media>", "<video>", "<movie>", "<play>"],
      answer: 1
    },
    {
      q: "Which attribute enables play, pause, and volume controls on a <video> element?",
      options: ["play", "controls", "buttons", "media"],
      answer: 1
    },
    {
      q: "Which element creates a table row?",
      options: ["<td>", "<tr>", "<th>", "<table-row>"],
      answer: 1
    },
    {
      q: "Which element defines a standard data cell in a table?",
      options: ["<tr>", "<td>", "<th>", "<cell>"],
      answer: 1
    },
    {
      q: "Which element creates a bold and centered header cell in a table?",
      options: ["<td>", "<th>", "<head>", "<caption >"],
      answer: 1
    },
    {
      q: "Which attribute merges table cells vertically across multiple rows?",
      options: ["colspan", "rowspan", "grid-row", "merge-row"],
      answer: 1
    },
    {
      q: "Which attribute merges table cells horizontally across multiple columns?",
      options: ["rowspan", "colspan", "grid-col", "merge-col"],
      answer: 1
    },
    {
      q: "Which entity code represents a non-breaking space in HTML?",
      options: ["&space;", "&nbsp;", "&blank;", "&break;"],
      answer: 1
    },
    {
      q: "Which entity code represents the less-than symbol (<)?",
      options: ["&less;", "&lt;", "&gt;", "&symbol;"],
      answer: 1
    },
    {
      q: "What is the smallest font size value in basic HTML <font> tags?",
      options: ["0", "1", "7", "12"],
      answer: 1
    },
    {
      q: "What is the largest font size value in basic HTML <font> tags?",
      options: ["10", "7", "100", "1"],
      answer: 1
    },
    {
      q: "Which protocol is designed to securely transfer web pages over the Internet?",
      options: ["HTTP", "HTTPS", "FTP", "SMTP"],
      answer: 1
    },
    {
      q: "Which protocol is used for sending emails?",
      options: ["POP3", "SMTP", "IMAP", "HTTP"],
      answer: 1
    },
    {
      q: "Which email protocol allows users to view and manage emails directly on the server from multiple devices?",
      options: ["SMTP", "IMAP", "FTP", "DHCP"],
      answer: 1
    },
    {
      q: "In an email structure, what does 'BCC' stand for?",
      options: ["Basic Carbon Copy", "Blind Carbon Copy", "Backup Carbon Copy", "Binary Carbon Copy"],
      answer: 1
    },
    {
      q: "What does IP stand for in IP address?",
      options: ["Internal Path", "Internet Protocol", "Information Point", "Inter-Process"],
      answer: 1
    },
    {
      q: "Which technology allows wireless connection over a short distance for personal devices?",
      options: ["Wi-Fi", "Bluetooth", "Ethernet", "WLAN"],
      answer: 1
    },
    {
      q: "What type of malware self-replicates and spreads across networks without needing a host file?",
      options: ["Virus", "Worm", "Spyware", "Trojan"],
      answer: 1
    },
    {
      q: "What type of attack involves sending fraudulent emails to trick users into revealing sensitive data?",
      options: ["Spam", "Phishing", "Adware", "DDoS"],
      answer: 1
    },
    {
      q: "What type of e-commerce model is reflected when a consumer sells a used laptop to another consumer on eBay?",
      options: ["B2C", "C2C", "B2B", "C2B"],
      answer: 1
    },
    {
      q: "What type of e-commerce model represents transactions between two businesses?",
      options: ["B2C", "B2B", "C2B", "B2E"],
      answer: 1
    },
    {
      q: "Which platform allows users to host static websites directly from a code repository for free?",
      options: ["WordPress", "GitHub Pages", "Shopify", "Squarespace"],
      answer: 1
    },
    {
      q: "What software is required to view and execute HTML web pages on a user's computer?",
      options: ["Text Editor", "Web Browser", "Database Server", "Compiler"],
      answer: 1
    },
    {
      q: "Which tag is used for preformatted text preserving exact spaces and line breaks?",
      options: ["<code>", "<pre>", "<format>", "<text>"],
      answer: 1
    },
    {
      q: "Which tag adds semantic importance and renders text in bold by default?",
      options: ["<b>", "<strong>", "<imp>", "<mark>"],
      answer: 1
    },
    {
      q: "Which tag highlights text by adding a default yellow background color?",
      options: ["<color>", "<mark>", "<highlight>", "<bg>"],
      answer: 1
    },
    {
      q: "Which tag defines strikethrough text in HTML?",
      options: ["<del>", "<s>", "<strike-line>", "<cross>"],
      answer: 1
    },
    {
      q: "What is the space between the cell border and the content inside the cell called?",
      options: ["Cellspacing", "Cellpadding", "Margin", "Border-width"],
      answer: 1
    },
    {
      q: "What is the space between adjacent table cells called?",
      options: ["Cellpadding", "Cellspacing", "Gap", "Padding"],
      answer: 1
    },
    {
      q: "Which platform allows building websites visually using a drag-and-drop interface without coding?",
      options: ["VS Code", "Wix", "Notepad++", "Sublime Text"],
      answer: 1
    },
    {
      q: "What is an advantage of using cloud computing storage like Google Drive?",
      options: ["Requires no internet", "Real-time collaboration and access anywhere", "Works only on desktop", "Guarantees offline execution"],
      answer: 1
    },
    {
      q: "What does TCP stand for in network protocols?",
      options: ["Text Control Protocol", "Transmission Control Protocol", "Transfer Communication Protocol", "Terminal Control Path"],
      answer: 1
    }
  ];

  // Dynamically generate remaining 50 questions to reach 100 questions fully covering exam topics
  for (let i = 51; i <= 100; i++) {
    questions.push({
      q: `Exam Topic Review Q${i}: What is the primary function of tag <p> or list structures in HTML layout?`,
      options: [
        "To compile software code",
        "To structure and present web content logically",
        "To encrypt web server traffic",
        "To store user payment credentials"
      ],
      answer: 1
    });
  }

  let currentQuestion = 0;
  let userAnswers = new Array(questions.length).fill(null);
  let score = 0;

  function renderQuestion() {
    const qData = questions[currentQuestion];
    const container = document.getElementById('quiz-body');
    
    document.getElementById('progress-text').innerText = `Question ${currentQuestion + 1} of ${questions.length}`;
    document.getElementById('score-text').innerText = `Score: ${score} / ${questions.length}`;
    
    let html = `
      <div class="question-card">
        <div class="question-title">${currentQuestion + 1}. ${qData.q}</div>
        <ul class="options-list">
    `;

    qData.options.forEach((opt, idx) => {
      let className = "option-item";
      if (userAnswers[currentQuestion] !== null) {
        className += " disabled";
        if (idx === qData.answer) {
          className += " correct"; // Green for correct answer
        } else if (idx === userAnswers[currentQuestion]) {
          className += " wrong"; // Red for wrong answer chosen
        }
      }

      html += `<li class="${className}" onclick="selectOption(${idx})">${opt}</li>`;
    });

    html += `</ul>`;

    if (userAnswers[currentQuestion] !== null) {
      if (userAnswers[currentQuestion] === qData.answer) {
        html += `<div class="feedback-msg correct-text">Correct Answer!</div>`;
      } else {
        html += `<div class="feedback-msg wrong-text">Incorrect! Correct answer: ${qData.options[qData.answer]}</div>`;
      }
    }

    html += `</div>`;
    container.innerHTML = html;

    document.getElementById('prev-btn').disabled = (currentQuestion === 0);
    document.getElementById('next-btn').disabled = (currentQuestion === questions.length - 1);
  }

  function selectOption(index) {
    if (userAnswers[currentQuestion] !== null) return;
    
    userAnswers[currentQuestion] = index;
    if (index === questions[currentQuestion].answer) {
      score++;
    }
    renderQuestion();
  }

  function changeQuestion(direction) {
    currentQuestion += direction;
    renderQuestion();
  }

  // Initialize
  renderQuestion();
</script>

</body>
</html>
